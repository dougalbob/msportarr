{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="calendar-header">
        <button onclick="changeYear(-1)" class="small secondary">◀ Prev</button>
        <h2 id="calendar-year">{{ year }} Season</h2>
        <button onclick="changeYear(1)" class="small secondary">Next ▶</button>
    </div>
    
    <div class="calendar-legend">
        <span class="legend-item"><span class="legend-dot past"></span> Completed</span>
        <span class="legend-item"><span class="legend-dot current"></span> This Weekend</span>
        <span class="legend-item"><span class="legend-dot future"></span> Upcoming</span>
    </div>
    {% if view_scope == 'all' %}
    <div class="calendar-series-legend" aria-label="Series colours">
        {% for item in calendar_series %}
        <span class="calendar-series-key"><span class="series-dot {{ item.key }}"></span>{{ item.name }}</span>
        {% endfor %}
    </div>
    {% endif %}
    
    <div class="calendar-grid" id="calendar-grid">
        <!-- Calendar months will be rendered here -->
    </div>
</div>

<!-- Race Detail Modal -->
<div class="modal-overlay" id="race-modal" onclick="closeModal(event)">
    <div class="modal-content calendar-modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="modal-title">Race Details</h3>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modal-body">
            <!-- Race details loaded here -->
        </div>
        <div class="modal-footer" id="modal-footer" style="display: none;">
            <button onclick="closeModal()" class="secondary">Cancel</button>
            <button onclick="downloadSelectedFromCalendar()" class="success" id="calendar-download-btn">
                ⬇️ Download Selected (<span id="calendar-selected-count">0</span>)
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentYear = {{ year }};
    const calendarData = {{ calendar_data | tojson }};
    const libraryStatusBySeries = {{ library_status | tojson }};
    const flagDataBySeries = {{ flag_data | tojson }};
    const calendarSeries = {{ calendar_series | tojson }};
    const calendarScope = {{ view_scope | tojson }};
    let calendarSelectedSessions = new Set();
    let currentSeriesKey = calendarSeries.length ? calendarSeries[0].key : 'motogp';
    let currentRoundNum = null;
    let currentModalDay = null;
    let currentDateHits = [];
    let racesByDate = {};
    let modalLiveTimer = null;

    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'];
    const shortMonthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                             'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const shortWeekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const dayKeyOrder = ['thursday', 'friday', 'saturday', 'sunday'];
    const dayKeyLabels = {
        thursday: 'Thursday',
        friday: 'Friday',
        saturday: 'Saturday',
        sunday: 'Sunday'
    };

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function parseLocalYMD(ymd) {
        if (!ymd) return null;
        const [y, m, d] = ymd.split('-').map(Number);
        if (!y || !m || !d) return null;
        return new Date(y, m - 1, d);
    }

    function toLocalYMD(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function shiftYMD(ymd, deltaDays) {
        const dt = parseLocalYMD(ymd);
        if (!dt) return ymd;
        dt.setDate(dt.getDate() + deltaDays);
        return toLocalYMD(dt);
    }

    function formatDDMMYYYY(ymd) {
        if (!ymd) return '';
        return ymd.split('-').reverse().join('-');
    }

    function formatShortDayTab(dayKey, ymd) {
        const shortDay = (dayKeyLabels[dayKey] || dayKey).slice(0, 3);
        const dt = parseLocalYMD(ymd);
        if (!dt) return shortDay;
        return `${shortDay} ${dt.getDate()} ${shortMonthNames[dt.getMonth()]}`;
    }

    function formatBrowserTime(dateObj) {
        const h = String(dateObj.getHours()).padStart(2, '0');
        const m = String(dateObj.getMinutes()).padStart(2, '0');
        return `${h}:${m}`;
    }

    function getBrowserTzLabel(refDate) {
        try {
            const sample = refDate || new Date();
            const iana = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
            const parts = Intl.DateTimeFormat(undefined, { timeZoneName: 'short' }).formatToParts(sample);
            const tzPart = parts.find(p => p.type === 'timeZoneName');
            const shortTz = tzPart ? tzPart.value : '';
            if (iana && shortTz && !iana.includes(shortTz)) {
                return `${shortTz} · ${iana}`;
            }
            return shortTz || iana || 'Local time';
        } catch (e) {
            return 'Local time';
        }
    }

    function getOrderedScheduleDays(race) {
        const schedule = race.schedule || {};
        const keys = dayKeyOrder.filter(k => schedule[k] && (schedule[k].sessions || []).length);
        Object.keys(schedule).forEach(k => {
            if (!keys.includes(k) && schedule[k] && (schedule[k].sessions || []).length) {
                keys.push(k);
            }
        });
        return keys;
    }

    function getAllRoundSessions(race) {
        const schedule = race.schedule || {};
        const items = [];
        getOrderedScheduleDays(race).forEach(dayKey => {
            const dayBlock = schedule[dayKey];
            (dayBlock.sessions || []).forEach(s => {
                const startDt = new Date(s.start_utc);
                const endDt = new Date(s.end_utc);
                const startMs = startDt.getTime();
                const endMs = endDt.getTime();
                if (!Number.isNaN(startMs) && !Number.isNaN(endMs)) {
                    items.push({
                        ...s,
                        dayKey,
                        trackDate: dayBlock.date,
                        startDt,
                        endDt,
                        startMs,
                        endMs
                    });
                }
            });
        });
        items.sort((a, b) => a.startMs - b.startMs);
        return items;
    }

    function getRoundTimingState(race, now = new Date()) {
        const isActive = race.active !== false && (!race.status || race.status === 'scheduled');
        if (!isActive) {
            return {
                isActive: false,
                isPast: false,
                isLiveWeekend: false,
                isFuture: false,
                currentSession: null,
                nextSession: null,
                allSessions: []
            };
        }

        const todayYMD = toLocalYMD(now);
        const nowMs = now.getTime();
        const weekendStartYMD = race.weekend_start || shiftYMD(race.date, -2);
        const weekendEndYMD = race.weekend_end || race.date;
        const allSessions = getAllRoundSessions(race);

        if (allSessions.length > 0) {
            const firstStartMs = allSessions[0].startMs;
            const lastEndMs = allSessions[allSessions.length - 1].endMs;
            const isPast = nowMs >= lastEndMs;
            const isLiveWeekend = !isPast && (
                todayYMD >= weekendStartYMD || nowMs >= firstStartMs - 12 * 3600 * 1000
            );
            const isFuture = !isPast && !isLiveWeekend;
            const currentSession = allSessions.find(s => nowMs >= s.startMs && nowMs < s.endMs) || null;
            const nextSession = allSessions.find(s => s.startMs > nowMs) || null;
            return {
                isActive: true,
                isPast,
                isLiveWeekend,
                isFuture,
                currentSession,
                nextSession,
                allSessions
            };
        }

        const isPast = todayYMD > weekendEndYMD;
        const isLiveWeekend = !isPast && todayYMD >= weekendStartYMD && todayYMD <= weekendEndYMD;
        const isFuture = !isPast && !isLiveWeekend;
        return {
            isActive: true,
            isPast,
            isLiveWeekend,
            isFuture,
            currentSession: null,
            nextSession: null,
            allSessions: []
        };
    }

    function resolveDayKeyForDate(race, clickedDateStr) {
        const schedule = race.schedule || {};
        const scheduleDays = getOrderedScheduleDays(race);

        if (clickedDateStr) {
            for (const dayKey of scheduleDays) {
                if (schedule[dayKey].date === clickedDateStr) {
                    return dayKey;
                }
            }
            if (race.date) {
                if (clickedDateStr === race.date) return 'sunday';
                if (clickedDateStr === shiftYMD(race.date, -1)) return 'saturday';
                if (clickedDateStr === shiftYMD(race.date, -2)) return 'friday';
                if (clickedDateStr === shiftYMD(race.date, -3)) return 'thursday';
            }
        }

        if (scheduleDays.includes('sunday')) return 'sunday';
        return scheduleDays[0] || 'sunday';
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const races = calendarData[currentYear] || [];
        const now = new Date();

        // Build lookup for every weekend date (Fri..Sun) without UTC Date string drift
        racesByDate = {};
        const timingByRound = {};

        races.forEach(race => {
            if (!race.date) return;
            const seriesKey = race.series || currentSeriesKey;
            timingByRound[`${seriesKey}:${race.number}`] = getRoundTimingState(race, now);

            const startYMD = race.weekend_start || shiftYMD(race.date, -2);
            const endYMD = race.weekend_end || race.date;
            let cursor = startYMD;
            let guard = 0;
            while (cursor && cursor <= endYMD && guard < 7) {
                const isRaceSunday = cursor === race.date;
                const hits = racesByDate[cursor] || (racesByDate[cursor] = []);
                const existing = hits.find(hit => hit.series === seriesKey &&
                    hit.race.number === race.number);
                if (!existing) {
                    hits.push({ race, series: seriesKey, isWeekend: !isRaceSunday });
                } else if (isRaceSunday) {
                    existing.isWeekend = false;
                }
                cursor = shiftYMD(cursor, 1);
                guard++;
            }
        });

        let html = '';

        for (let month = 0; month < 12; month++) {
            const firstDay = new Date(currentYear, month, 1);
            const lastDay = new Date(currentYear, month + 1, 0);
            const startPadding = firstDay.getDay();

            html += `<div class="calendar-month">`;
            html += `<div class="month-header">${monthNames[month]}</div>`;
            html += `<div class="month-days-header">
                <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
            </div>`;
            html += `<div class="month-days">`;

            for (let i = 0; i < startPadding; i++) {
                html += `<span class="day empty"></span>`;
            }

            for (let day = 1; day <= lastDay.getDate(); day++) {
                const dateStr = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hits = racesByDate[dateStr] || [];

                let classes = ['day'];
                let tooltip = '';
                let onclick = '';
                let dayContents = String(day);

                if (hits.length) {
                    const primary = hits.find(hit => !hit.isWeekend) || hits[0];
                    const race = primary.race;
                    const seriesKey = primary.series;
                    const timing = timingByRound[`${seriesKey}:${race.number}`];
                    const seriesKeys = [...new Set(hits.map(hit => hit.series))];

                    classes.push('race');
                    if (!timing || !timing.isActive) {
                        classes.push('future', 'inactive');
                    } else if (timing.isLiveWeekend) {
                        classes.push('current');
                    } else if (timing.isPast) {
                        classes.push('past');
                    } else {
                        classes.push('future');
                    }
                    if (primary.isWeekend) classes.push('weekend');
                    else classes.push('race-day');
                    if (seriesKeys.length > 1) classes.push('multi-series');

                    tooltip = hits.map(hit => {
                        const label = hit.race.series_name || hit.series;
                        const dayKey = resolveDayKeyForDate(hit.race, dateStr);
                        const dayLabel = dayKeyLabels[dayKey] || '';
                        return `${label} · Round ${hit.race.number}: ${hit.race.venue}` +
                            `${dayLabel ? ' — ' + dayLabel : ''}`;
                    }).join(' | ');
                    onclick = `onclick="showDateDetails('${dateStr}')"`;
                    const markers = seriesKeys.map(key =>
                        `<i class="series-dot ${escapeHtml(key)}" title="${escapeHtml(
                            hits.find(hit => hit.series === key)?.race.series_name || key
                        )}"></i>`
                    ).join('');
                    dayContents = `<span class="day-number">${day}</span>` +
                        `<span class="day-series-markers">${markers}</span>`;
                }

                html += `<span class="${classes.join(' ')}" title="${escapeHtml(tooltip)}" ${onclick}>${dayContents}</span>`;
            }

            html += `</div></div>`;
        }

        grid.innerHTML = html;
        document.getElementById('calendar-year').textContent = `${currentYear} Season`;
    }

    function changeYear(delta) {
        const years = Object.keys(calendarData).map(Number).sort((a, b) => a - b);
        const currentIndex = years.indexOf(currentYear);
        const newIndex = currentIndex + delta;

        if (newIndex >= 0 && newIndex < years.length) {
            currentYear = years[newIndex];
            renderCalendar();

            fetch(`/calendar-data?year=${currentYear}&scope=${encodeURIComponent(calendarScope)}`)
                .then(r => r.json())
                .then(data => {
                    const yearKey = String(data.year || currentYear);
                    if (data.calendar_data) calendarData[yearKey] = data.calendar_data;
                    const statusBySeries = data.library_status_by_series ||
                        (data.series_keys || []).reduce((result, key) => {
                            if (data.series !== 'all' && data.series_keys.length === 1) {
                                result[key] = { [yearKey]: data.library_status || {} };
                            }
                            return result;
                        }, {});
                    Object.entries(statusBySeries).forEach(([key, byYear]) => {
                        libraryStatusBySeries[key] = libraryStatusBySeries[key] || {};
                        Object.assign(libraryStatusBySeries[key], byYear);
                    });
                    Object.entries(data.flag_data || {}).forEach(([key, byYear]) => {
                        flagDataBySeries[key] = flagDataBySeries[key] || {};
                        Object.assign(flagDataBySeries[key], byYear);
                    });
                    renderCalendar();
                })
                .catch(() => {});
        }
    }

    function selectModalDay(dayKey) {
        currentModalDay = dayKey;
        renderModalContent();
    }

    function renderLiveOrFutureStatus(race, timing, now) {
        if (timing.isLiveWeekend) {
            if (timing.currentSession) {
                const cur = timing.currentSession;
                let activePartLabel = '';
                if (cur.parts && cur.parts.length) {
                    const nowMs = now.getTime();
                    const activePart = cur.parts.find(p => {
                        const ps = new Date(p.start_utc).getTime();
                        const pe = new Date(p.end_utc).getTime();
                        return nowMs >= ps && nowMs < pe;
                    });
                    if (activePart) {
                        activePartLabel = ` · ${activePart.label}`;
                    }
                }
                const rangeStr = `${formatBrowserTime(cur.startDt)}–${formatBrowserTime(cur.endDt)}`;
                return `
                    <div class="race-live-status is-underway">
                        <div class="live-status-main">
                            <span class="live-now-badge">● NOW</span>
                            <span class="live-session-name">${escapeHtml(cur.full_name + activePartLabel)}</span>
                        </div>
                        <div class="live-status-meta">${rangeStr} (${cur.duration_mins}m)</div>
                    </div>
                `;
            }

            if (timing.nextSession) {
                const next = timing.nextSession;
                const sameLocalDay = toLocalYMD(next.startDt) === toLocalYMD(now);
                const nextTimeText = sameLocalDay
                    ? formatBrowserTime(next.startDt)
                    : `${shortWeekdays[next.startDt.getDay()]} ${formatBrowserTime(next.startDt)}`;
                return `
                    <div class="race-live-status is-upcoming">
                        <div class="live-status-left">
                            <div class="live-next-caption">Next session</div>
                            <div class="live-session-name">${escapeHtml(next.full_name)}</div>
                        </div>
                        <div class="live-next-time-box">
                            <div class="live-next-time">${escapeHtml(nextTimeText)}</div>
                            <div class="live-status-meta">${next.duration_mins}m</div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="race-live-status is-upcoming">
                    <div class="live-status-main">
                        <span class="live-now-badge">🏁 LIVE</span>
                        <span class="live-session-name">Race Weekend</span>
                    </div>
                </div>
            `;
        }

        // Future round: compact "days to go" based on Sunday race day
        const raceLocal = parseLocalYMD(race.date);
        const todayLocal = parseLocalYMD(toLocalYMD(now));
        const daysUntil = raceLocal && todayLocal
            ? Math.max(1, Math.round((raceLocal - todayLocal) / (1000 * 60 * 60 * 24)))
            : 0;
        const unitLabel = daysUntil === 1 ? 'day to go' : 'days to go';

        return `
            <div class="race-countdown-compact">
                <span class="countdown-compact-num">${daysUntil}</span>
                <span class="countdown-compact-label">${unitLabel}</span>
            </div>
        `;
    }

    function renderDayScheduleSection(race, timing, now) {
        const scheduleDays = getOrderedScheduleDays(race);

        if (scheduleDays.length > 0) {
            const activeDay = scheduleDays.includes(currentModalDay)
                ? currentModalDay
                : scheduleDays[0];
            const dayBlock = race.schedule[activeDay];
            const daySessions = (dayBlock.sessions || []).map(s => {
                const startDt = new Date(s.start_utc);
                const endDt = new Date(s.end_utc);
                return {
                    ...s,
                    startDt,
                    endDt,
                    startMs: startDt.getTime(),
                    endMs: endDt.getTime()
                };
            });

            const sampleDate = daySessions.length ? daySessions[0].startDt : now;
            const tzLabel = getBrowserTzLabel(sampleDate);
            const nowMs = now.getTime();
            const nextStartMs = timing.nextSession ? timing.nextSession.startMs : null;
            const nextKey = timing.nextSession ? timing.nextSession.key : null;

            let html = `<div class="day-schedule-panel">`;

            // Day switcher pills (pre-selected to clicked day)
            html += `<div class="schedule-day-tabs" role="tablist">`;
            scheduleDays.forEach(dKey => {
                const isSelected = dKey === activeDay;
                const dDate = race.schedule[dKey].date;
                html += `<button type="button"
                                 class="schedule-day-tab ${isSelected ? 'active' : ''}"
                                 role="tab"
                                 aria-selected="${isSelected ? 'true' : 'false'}"
                                 onclick="selectModalDay('${dKey}')">${escapeHtml(formatShortDayTab(dKey, dDate))}</button>`;
            });
            html += `</div>`;

            html += `
                <div class="schedule-subheader">
                    <span class="schedule-day-heading">${escapeHtml(dayKeyLabels[activeDay] || activeDay)} · ${formatDDMMYYYY(dayBlock.date)}</span>
                    <span class="schedule-tz-note" title="Session times converted to your browser timezone">🕒 ${escapeHtml(tzLabel)}</span>
                </div>
            `;

            html += `<div class="day-timetable">`;
            daySessions.forEach(s => {
                const isNow = timing.isLiveWeekend && nowMs >= s.startMs && nowMs < s.endMs;
                const isDone = timing.isLiveWeekend && nowMs >= s.endMs;
                const isNext = timing.isLiveWeekend && !timing.currentSession
                    && s.key === nextKey && s.startMs === nextStartMs;

                const rowClasses = ['timetable-row', `row-class-${s.class}`];
                if (isNow) rowClasses.push('is-now');
                else if (isNext) rowClasses.push('is-next');
                else if (isDone) rowClasses.push('is-done');

                const localDateYMD = toLocalYMD(s.startDt);
                const dayShiftChip = localDateYMD !== dayBlock.date
                    ? `<span class="timetable-day-shift">${shortWeekdays[s.startDt.getDay()]}</span>`
                    : '';

                const timeRangeTitle = `${formatBrowserTime(s.startDt)} – ${formatBrowserTime(s.endDt)}`;

                let partsHtml = '';
                if (s.parts && s.parts.length) {
                    const partsText = s.parts.map(p => {
                        const pStart = new Date(p.start_utc);
                        return `${escapeHtml(p.label)} ${formatBrowserTime(pStart)} (${p.duration_mins}m)`;
                    }).join(' · ');
                    partsHtml = `<div class="timetable-parts">${partsText}</div>`;
                }

                let rightBadge = `<span class="timetable-duration">${s.duration_mins}m</span>`;
                if (isNow) {
                    rightBadge = `<span class="timetable-state-pill state-now">NOW</span><span class="timetable-duration">${s.duration_mins}m</span>`;
                } else if (isNext) {
                    rightBadge = `<span class="timetable-state-pill state-next">NEXT</span><span class="timetable-duration">${s.duration_mins}m</span>`;
                } else if (isDone) {
                    rightBadge = `<span class="timetable-done-check" title="Session finished">✓</span><span class="timetable-duration">${s.duration_mins}m</span>`;
                }

                html += `
                    <div class="${rowClasses.join(' ')}" title="${escapeHtml(timeRangeTitle)}">
                        <div class="timetable-time">
                            ${formatBrowserTime(s.startDt)}${dayShiftChip}
                        </div>
                        <span class="session-class-badge class-${escapeHtml(s.class)}">${escapeHtml(s.class_label)}</span>
                        <div class="timetable-session">
                            <div class="timetable-session-name">${escapeHtml(s.short_name)}</div>
                            ${partsHtml}
                        </div>
                        <div class="timetable-right">${rightBadge}</div>
                    </div>
                `;
            });
            html += `</div></div>`;
            return html;
        }

        // Fallback for provisional calendars that have weekend_formats but no start times yet
        if (race.format && Object.keys(race.format).length) {
            const formatDays = dayKeyOrder.filter(k => Array.isArray(race.format[k]) && race.format[k].length);
            if (!formatDays.length) return '';
            const activeDay = formatDays.includes(currentModalDay) ? currentModalDay : formatDays[0];
            const sessions = race.format[activeDay] || [];

            let html = `<div class="day-schedule-panel">`;
            html += `<div class="schedule-day-tabs" role="tablist">`;
            formatDays.forEach(dKey => {
                const isSelected = dKey === activeDay;
                html += `<button type="button"
                                 class="schedule-day-tab ${isSelected ? 'active' : ''}"
                                 onclick="selectModalDay('${dKey}')">${escapeHtml((dayKeyLabels[dKey] || dKey).slice(0, 3))}</button>`;
            });
            html += `</div>`;
            html += `
                <div class="schedule-subheader">
                    <span class="schedule-day-heading">${escapeHtml(dayKeyLabels[activeDay] || activeDay)} (${escapeHtml(race.series_name || currentSeriesKey)})</span>
                    <span class="schedule-tz-note">Start times TBC</span>
                </div>
                <div class="day-timetable">
            `;
            sessions.forEach(s => {
                html += `
                    <div class="timetable-row row-class-motogp">
                        <div class="timetable-time muted">TBC</div>
                        <span class="session-class-badge">${escapeHtml(race.series_name || currentSeriesKey)}</span>
                        <div class="timetable-session">
                            <div class="timetable-session-name">${escapeHtml(s.label)}</div>
                        </div>
                        <div class="timetable-right">
                            <span class="timetable-duration">${s.duration_mins}m</span>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            return html;
        }

        return '';
    }

    function renderModalContent() {
        const races = calendarData[currentYear] || [];
        const race = races.find(r => (r.series || currentSeriesKey) === currentSeriesKey &&
            r.number === currentRoundNum);
        if (!race) return;

        const now = new Date();
        const timing = getRoundTimingState(race, now);
        const yearLibStatus = (libraryStatusBySeries[currentSeriesKey] || {})[String(currentYear)] || {};
        const status = yearLibStatus[currentRoundNum] || {};
        const yearFlags = (flagDataBySeries[currentSeriesKey] || {})[String(currentYear)] || {};
        const flag = yearFlags[currentRoundNum] || '';

        const startFormatted = race.weekend_start ? formatDDMMYYYY(race.weekend_start) : '';
        const raceFormatted = formatDDMMYYYY(race.date);
        const headerDateText = (!timing.isPast && startFormatted && startFormatted !== raceFormatted)
            ? `${startFormatted} – ${raceFormatted}`
            : raceFormatted;

        const statusLabel = race.status && race.status !== 'scheduled'
            ? `<div class="race-status-badge race-status-${escapeHtml(race.status)}">${escapeHtml(race.status.toUpperCase())}</div>`
            : '';

        let html = `
            <div class="race-detail-header">
                <div class="race-detail-flag">
                    ${flag ? `<img src="/flags/${escapeHtml(flag)}" class="modal-flag-avatar" alt="">` : ''}
                </div>
                <div class="race-detail-info">
                    <div class="race-round">${escapeHtml(race.series_name || currentSeriesKey)} · Round ${race.number}</div>
                    <div class="race-venue">${escapeHtml(race.venue)}</div>
                    <div class="race-date">${escapeHtml(headerDateText)}</div>
                    ${statusLabel}
                </div>
            </div>
        `;

        if (!timing.isActive) {
            const noteHtml = race.status_note
                ? `<div class="race-status-note">${escapeHtml(race.status_note)}</div>`
                : '';
            html += `<div class="race-progress">
                <div class="race-progress-label">This round is marked as ${escapeHtml(race.status)}.</div>
                ${noteHtml}
            </div>`;
            document.getElementById('modal-footer').style.display = 'none';
        } else if (timing.isPast) {
            // Past events: show library status and missing-session download controls only
            const grabbed = status.grabbed || 0;
            const total = status.total || 0;
            const pct = total > 0 ? Math.round(grabbed / total * 100) : 0;

            html += `
                <div class="race-progress">
                    <div class="race-progress-label">Library Status: ${grabbed}/${total} sessions (${pct}%)</div>
                    <div class="progress-bar">
                        <div class="progress-bar-fill" style="width: ${pct}%"></div>
                    </div>
                </div>
            `;

            if (status.sessions) {
                const hasMissing = status.sessions.some(s => !s.exists);
                const selectedKeys = new Set(
                    Array.from(calendarSelectedSessions).map(raw => JSON.parse(raw).key)
                );

                html += `<div class="race-sessions-list">`;
                status.sessions.forEach(s => {
                    if (s.exists) {
                        html += `<div class="library-session exists">✅ ${escapeHtml(s.name)}</div>`;
                    } else {
                        const sessionKey = `${currentYear}_R${String(currentRoundNum).padStart(2, '0')}_E${String(s.episode || 0).padStart(2, '0')}`;
                        const checked = selectedKeys.has(sessionKey) ? 'checked' : '';
                        html += `
                            <div class="library-session missing">
                                <label class="session-checkbox-label">
                                    <input type="checkbox"
                                           class="session-checkbox calendar-session-cb"
                                           data-session-key="${escapeHtml(sessionKey)}"
                                           data-round="${currentRoundNum}"
                                           data-session="${escapeHtml(s.type || '')}"
                                           data-name="${escapeHtml(s.name)}"
                                           ${checked}
                                           onchange="toggleCalendarSession(this)">
                                    <span class="checkbox-custom"></span>
                                    <span class="session-name">❌ ${escapeHtml(s.name)}</span>
                                </label>
                            </div>
                        `;
                    }
                });
                html += `</div>`;
                document.getElementById('modal-footer').style.display = hasMissing ? 'flex' : 'none';
            } else {
                document.getElementById('modal-footer').style.display = 'none';
            }
        } else {
            html += renderLiveOrFutureStatus(race, timing, now);
            html += renderDayScheduleSection(race, timing, now);
            document.getElementById('modal-footer').style.display = 'none';
        }

        document.getElementById('modal-title').textContent = race.venue;
        document.getElementById('modal-body').innerHTML = html;
        updateCalendarDownloadBtn();

        if (modalLiveTimer) {
            clearInterval(modalLiveTimer);
            modalLiveTimer = null;
        }
        if (timing.isLiveWeekend) {
            modalLiveTimer = setInterval(() => {
                if (document.getElementById('race-modal').classList.contains('active')) {
                    renderModalContent();
                }
            }, 30000);
        }
    }

    function showDateDetails(clickedDateStr) {
        const hits = racesByDate[clickedDateStr] || [];
        if (!hits.length) return;
        if (hits.length === 1) {
            showRaceDetails(hits[0].series, hits[0].race.number, clickedDateStr);
            return;
        }

        currentDateHits = hits;
        document.getElementById('modal-title').textContent = 'Race weekends';
        document.getElementById('modal-footer').style.display = 'none';
        document.getElementById('modal-body').innerHTML = `
            <p class="help-text">More than one championship is racing this day. Choose a meeting:</p>
            <div class="calendar-race-choices">
                ${hits.map(hit => `
                    <button type="button" class="calendar-race-choice"
                        onclick="showRaceDetails('${escapeHtml(hit.series)}', ${hit.race.number}, '${clickedDateStr}')">
                        <span class="series-dot ${escapeHtml(hit.series)}"></span>
                        <span><strong>${escapeHtml(hit.race.series_name || hit.series)}</strong>
                        <small>Round ${hit.race.number} · ${escapeHtml(hit.race.venue)}</small></span>
                    </button>
                `).join('')}
            </div>`;
        document.getElementById('race-modal').classList.add('active');
    }

    function showRaceDetails(seriesOrRound, roundOrDate, clickedDateStr) {
        // Two-argument form is retained for legacy calendar-script callers.
        let seriesKey, roundNumber;
        if (clickedDateStr === undefined) {
            seriesKey = calendarSeries.length ? calendarSeries[0].key : currentSeriesKey;
            roundNumber = seriesOrRound;
            clickedDateStr = roundOrDate;
        } else {
            seriesKey = seriesOrRound;
            roundNumber = roundOrDate;
        }
        const races = calendarData[currentYear] || [];
        const race = races.find(r => (r.series || seriesKey) === seriesKey &&
            r.number === roundNumber);
        if (!race) return;

        currentSeriesKey = seriesKey;
        currentRoundNum = roundNumber;
        currentModalDay = resolveDayKeyForDate(race, clickedDateStr);
        calendarSelectedSessions.clear();

        renderModalContent();
        document.getElementById('race-modal').classList.add('active');
    }

    function toggleCalendarSession(checkbox) {
        const key = checkbox.dataset.sessionKey;
        const data = {
            key: key,
            round: checkbox.dataset.round,
            session: checkbox.dataset.session,
            name: checkbox.dataset.name,
            series: currentSeriesKey
        };

        if (checkbox.checked) {
            calendarSelectedSessions.add(JSON.stringify(data));
        } else {
            calendarSelectedSessions.forEach(s => {
                if (JSON.parse(s).key === key) {
                    calendarSelectedSessions.delete(s);
                }
            });
        }
        updateCalendarDownloadBtn();
    }

    function updateCalendarDownloadBtn() {
        const count = calendarSelectedSessions.size;
        document.getElementById('calendar-selected-count').textContent = count;
        document.getElementById('calendar-download-btn').disabled = count === 0;
    }

    function downloadSelectedFromCalendar() {
        if (calendarSelectedSessions.size === 0) return;

        const selections = Array.from(calendarSelectedSessions).map(s => JSON.parse(s));

        fetch('/download-selected', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                season: currentYear,
                series: currentSeriesKey,
                selections: selections
            })
        })
        .then(r => r.json())
        .then(() => {
            showToast(`Starting download of ${selections.length} sessions...`, 'success');
            closeModal();

            setTimeout(() => {
                window.location.href = '/';
            }, 1500);
        })
        .catch(() => {
            showToast('Failed to start download', 'error');
        });
    }

    function closeModal(event) {
        if (!event || event.target.classList.contains('modal-overlay')) {
            document.getElementById('race-modal').classList.remove('active');
            calendarSelectedSessions.clear();
            if (modalLiveTimer) {
                clearInterval(modalLiveTimer);
                modalLiveTimer = null;
            }
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    window.addEventListener('load', renderCalendar);
</script>
{% endblock %}
