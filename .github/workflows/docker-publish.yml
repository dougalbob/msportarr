name: Build and publish

# Builds the container image in GitHub Actions and pushes it to GHCR, so the
# image never has to be built by hand again.
#
#   push tag v2.3.0   ->  :2.3.0  :2.3  :latest  :sha-<commit>
#   push to main      ->  :edge   :sha-<commit>      (latest is NOT moved)
#   manual run        ->  tags for whichever ref you pick
#
# Only a version tag moves :latest, so a work-in-progress main commit can never
# reach a container that is force-updated in Unraid.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Validate season calendars
        run: python utils/validate_calendar.py

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=MotoGParr
            org.opencontainers.image.description=MotoGP automated retrieval and Plex library manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Exposed by the container at startup, so you can confirm what is running.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests are built (to prove the image still builds) but not pushed.
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MOTOGPARR_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A push can fail with "denied: permission_denied: read_package" even
      # though the token has packages:write. That happens when the GHCR package
      # already exists, is private, and is not linked to this repository: the
      # workflow token then cannot even read it, so it cannot push either.
      # Nothing in the workflow can fix that - it is a one-time setting on the
      # package - so spell out exactly what to change.
      - name: Explain GHCR permission failure
        if: failure()
        run: |
          cat <<'MSG'
          ::error title=GHCR push denied::The workflow token cannot read the package.

          If the error above is "denied: permission_denied: read_package", the
          package ghcr.io/${{ github.repository_owner }}/motogparr already exists,
          is PRIVATE, and is not linked to this repository. Fix it once:

            1. Open https://github.com/users/${{ github.repository_owner }}/packages/container/motogparr/settings
            2. "Danger Zone" -> Change visibility -> Public
            3. (recommended) "Manage Actions access" -> add this repository
               with the Write role, so the workflow owns what it publishes

          After that, re-run this job. Making the *repository* public does not
          change the visibility of an existing package - they are separate.
          MSG
