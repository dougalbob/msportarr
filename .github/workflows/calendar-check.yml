name: Calendar check

# Fails a pull request when a season calendar is edited in a way that would
# break the grabber or the Plex library: duplicate or gappy round numbers,
# folder names that disagree with the round, bad dates, unparseable or
# inconsistent session times, missing artwork, duplicate JSON keys.
#
# Also prints the parsed calendar so a change to the championship numbering is
# visible in the PR diff review.

on:
  pull_request:
    paths:
      - 'config/motogp_*.json'
      - 'config/f1_*.json'
      - 'series/*.py'
      - 'assets/**'
      - 'utils/validate_calendar.py'
      - 'motogp_common.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate calendars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Reject duplicate JSON keys
        run: |
          # json.load() silently keeps the last duplicate key, which is an easy
          # way to lose a round when editing by hand. Fail loudly instead.
          failed=0
          for calendar in config/motogp_*.json config/f1_*.json; do
            echo "--- $calendar ---"
            python - "$calendar" <<'PY' || failed=1
          import json, sys

          def no_duplicates(pairs):
              seen = {}
              for key, value in pairs:
                  if key in seen:
                      raise ValueError(f"duplicate key {key!r}")
                  seen[key] = value
              return seen

          path = sys.argv[1]
          with open(path) as f:
              json.load(f, object_pairs_hook=no_duplicates)
          print("  no duplicate keys")
          PY
          done
          exit $failed

      - name: Validate calendars
        # One invocation for every registered series: the validator discovers
        # <prefix>_<year>.json from the declarations in series/, so a new
        # championship is validated by existing rather than by adding a second
        # loop here. (It previously looped over motogp_*.json and stripped the
        # prefix with sed, which is how an f1 calendar would have been handed
        # to the validator as "season f1_2026".)
        run: python utils/validate_calendar.py

      - name: Show round numbering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("config").glob("*_2*.json")):
              data = json.loads(path.read_text())
              print(f"\n{path.name} - {len(data['rounds'])} rounds")
              for entry in data["rounds"]:
                  status = entry.get("status", "scheduled")
                  marker = "" if status == "scheduled" else f"  [{status}]"
                  print(f"  {entry['round']:>2}  {entry['venue']:<16} "
                        f"{entry['date']}  {entry['folder']}{marker}")
          PY

      - name: Run tests
        run: python -m pytest tests -q
