name: Release

# Turns a version tag into a GitHub release with notes generated from the
# merged pull requests since the previous tag, and writes the same text to
# RELEASE_NOTES_v<version>.md so the notes live in the repository too.
#
# Why generated: the previous three releases were written by hand, which took an
# hour each and drifted from what the commits actually did. Labels on PRs are the
# only input (see .github/release.yml), so the notes cannot quietly omit a change
# that was labelled.
#
# Anything genuinely worth explaining - a migration step, a behaviour change -
# belongs in the PR description and will appear in the "Other changes" /
# category list. This workflow does not invent prose.

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)generate notes for, e.g. 1.0.0'
        required: true

permissions:
  contents: write       # to commit the notes file to a branch
  pull-requests: write  # to open/update the release-notes pull request
  issues: write         # to create the ignore-for-release label if it is absent
  packages: read        # to confirm the tagged image and :latest were published

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags are needed to find the previous release

      - name: Resolve the tag and version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The tag format matters: docker-publish.yml derives :1.0 and :latest from
      # a bare semver tag (X.Y.Z, no 'v' prefix). "V.2.2.1" silently produced no
      # 2.2 tag, which is why this check exists rather than a comment saying "use semver".
      - name: Require a X.Y.Z tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad tag format::'$tag' is not X.Y.Z (no 'v' prefix)."
            echo "The container workflow derives :MAJOR.MINOR and :latest from"
            echo "bare semver tags; 'V.2.2.1' did not, and shipped untagged images."
            exit 1
          fi

      # Publishing is the last moment this can be caught cheaply. If the tagged
      # tree does not pin its own tag in the Unraid template, every fresh
      # install would fetch a different version's template - and the v2.11.0
      # sequence (tag before the bump merged) is exactly how that happens.
      # A release is cheap to redo before publication and expensive after.
      - name: The tagged tree must pin its own tag in the Unraid template
        run: |
          tag="${{ steps.version.outputs.tag }}"
          pinned=$(sed -n 's|.*msportarr/\([^/]*\)/unraid/msportarr\.xml.*|\1|p' \
            unraid/msportarr.xml | head -1)
          if [ "$pinned" != "$tag" ]; then
            echo "::error title=Template pin does not match the tag::unraid/msportarr.xml pins '$pinned' but you are releasing '$tag'."
            echo "Merge a PR that bumps TemplateURL to $tag, then tag that merge commit."
            echo "See scripts/check_release_readiness.py - it runs on every PR to main."
            exit 1
          fi

      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ steps.version.outputs.tag }}"
          # Tags are listed newest first, so the first one that is not the tag
          # being released is the previous release.
          previous=$(gh release list --limit 50 --json tagName --jq '.[].tagName' \
            | grep -Ex '[0-9]+\.[0-9]+\.[0-9]+' | grep -vx "$current" | head -1 || true)
          echo "tag=${previous}" >> "$GITHUB_OUTPUT"
          if [ -z "$previous" ]; then
            echo "No earlier release; notes will list all merged pull requests."
          else
            echo "Generating notes since ${previous}"
          fi

      - name: Generate notes from merged pull requests
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # generate-notes is POST, and takes JSON fields - gh api defaults to
          # GET and its own naming, so both have to be explicit here.
          args=(
            --method POST
            "repos/${{ github.repository }}/releases/generate-notes"
            -f "tag_name=${{ steps.version.outputs.tag }}"
            -f "configuration_file_path=.github/release.yml"
          )
          if [ -n "${{ steps.previous.outputs.tag }}" ]; then
            args+=(-f "previous_tag_name=${{ steps.previous.outputs.tag }}")
          fi

          gh api "${args[@]}" --jq .body > generated_notes.md

          # A release with an empty body usually means every PR was unlabelled or
          # excluded. Say so instead of publishing a blank page.
          if [ ! -s generated_notes.md ]; then
            echo "::warning title=Empty release notes::No pull requests matched. Check PR labels."
          fi

          echo "--- generated ---"
          head -40 generated_notes.md

      - name: Write the notes into the repository
        run: |
          file="RELEASE_NOTES_v${{ steps.version.outputs.version }}.md"
          {
            echo "# msportarr ${{ steps.version.outputs.tag }}"
            echo
            cat generated_notes.md
            echo
            echo "---"
            echo
            echo "_Generated from merged pull requests. Container image:_"
            echo "\`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\`"
          } > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
        id: writeup

      # Publishing the tagged release is the primary operation. Keep it ahead
      # of the supplementary in-repository notes PR so a label, PR permission,
      # or branch-policy problem cannot leave a built image without a matching
      # GitHub Release (which is what happened for 1.1.0).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; updating its notes."
            gh release edit "$tag" --notes-file generated_notes.md
          else
            gh release create "$tag" \
              --title "msportarr $tag" \
              --notes-file generated_notes.md \
              --verify-tag
          fi

      # Commit the notes file to a release-notes branch and propose it to main
      # through a pull request. main itself is never touched directly, and the
      # branch/PR is updated in place on re-runs (no force-push).
      - name: Commit release notes to a release-notes branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release-notes/v${{ steps.version.outputs.version }}"
          file="RELEASE_NOTES_v${{ steps.version.outputs.version }}.md"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git fetch origin main >/dev/null 2>&1 || true
          # Fetch the release-notes branch from a previous run. Without this,
          # a re-run creates a new branch from origin/main and the push is
          # rejected as non-fast-forward, which is how the v2.7.0 re-run
          # failed after the permission was fixed.
          if git fetch origin "$branch" >/dev/null 2>&1; then
            git checkout -B "$branch" FETCH_HEAD
            git merge --ff-only origin/main 2>/dev/null || true
          else
            git checkout -B "$branch" origin/main
          fi

          git add "$file"
          git commit -m "Add $file" >/dev/null 2>&1 || true   # no-op when unchanged
          # Do not swallow a push failure: the remote branch is the durable
          # in-repository copy even when repository policy prevents the PR from
          # being opened. Pushing an existing, up-to-date branch is a no-op.
          git push origin "$branch"

      - name: Open or update the release-notes pull request
        id: notes_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release-notes/v${{ steps.version.outputs.version }}"
          version="${{ steps.version.outputs.version }}"
          title="Add release notes RELEASE_NOTES_v${version}.md"
          # An unquoted heredoc performs command substitution. The old body used
          # Markdown backticks in one, so bash tried to execute the filename,
          # `main`, and the branch name before gh ever received the body.
          printf -v body '%s\n' \
            "Proposes adding \`RELEASE_NOTES_v${version}.md\` to \`main\`." \
            "" \
            "The release notes were generated from merged pull requests and are" \
            "also attached to the release. The same file is committed to branch" \
            "\`release-notes/v${version}\` and proposed here; re-running this" \
            "workflow updates the branch and this PR in place (no force-push)." \
            "" \
            "Verification: this workflow is exercised on a real tag push, which" \
            "is the maintainer's action - it cannot be exercised from a PR run."

          # A new repository may not have this custom label yet. Creating it is
          # idempotent, and prevents `gh pr create --label` from aborting the
          # release as it did for 1.1.0.
          gh label create ignore-for-release \
            --description "Exclude release-maintenance pull requests from generated release notes." \
            --color 777777 --force

          existing=$(gh pr list --head "$branch" --base main --json number --jq '.[].number' | head -1)
          # This generated notes PR must pass pr-label-check, and must not
          # recursively appear as a change in the next release's own notes.
          if [ -n "$existing" ]; then
            echo "Updating existing PR #$existing"
            gh pr edit "$existing" --title "$title" --body "$body" --add-label ignore-for-release
          else
            echo "Creating new PR"
            # Repository policy can still prevent GITHUB_TOKEN from opening a
            # PR. Keep publishing the actual release in that case: the notes are
            # safely pushed to a branch and the compare URL below lets a
            # maintainer open the PR in one click.
            gh pr create --title "$title" --body "$body" --head "$branch" --base main --label ignore-for-release || true
          fi

          number=$(gh pr list --head "$branch" --base main --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            compare_url="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
            echo "::warning title=Release-notes PR needs maintainer action::GitHub Actions could not create the PR. Check the command output and repository Actions policy, or open ${compare_url}"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "compare_url=${compare_url}" >> "$GITHUB_OUTPUT"
          else
            echo "Release-notes pull request #${number} is open for $branch"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the notes file as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-notes-${{ steps.version.outputs.version }}
          path: RELEASE_NOTES_v*.md
          retention-days: 30

      # The image is the artefact users actually run, so "the release shipped"
      # means the versioned tag and :latest exist - not that this job is green.
      # The build runs in a *different* workflow (docker-publish.yml) on the
      # same tag push, so it is polled here rather than assumed. This cannot
      # start a build, and it cannot repair one: it reports exactly which tag
      # is missing so the maintainer knows whether to wait or to investigate.
      - name: Confirm the container image was published for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          version="${{ steps.version.outputs.version }}"
          repo="${{ github.repository }}"
          owner="${repo%%/*}"
          package="${repo##*/}"

          check() {
            gh api "users/${owner}/packages/container/${package}/versions" \
              --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -qx "$1"
          }

          # The image build starts on the same tag push, so it is normally
          # still running. Give it a bounded wait rather than failing at once.
          for attempt in $(seq 1 40); do
            if check "$version" && check "latest"; then
              echo "Published: :${version} and :latest both resolve."
              exit 0
            fi
            sleep 15
          done

          if check "$version"; then
            echo "::error title=:latest was not moved::ghcr.io/${repo}:${version} exists but :latest does not."
            echo "Unraid installs track :latest by default, so they would not receive this release."
          else
            echo "::error title=Image missing::ghcr.io/${repo}:${version} was not published within 10 minutes."
            echo "Check the 'Build and publish' workflow run for tag ${{ steps.version.outputs.tag }}."
          fi
          echo "The release notes are published; the image is the missing half."
          exit 1

      # The release body and the in-repo file are both the generated notes.
      # No hand-written companion is concatenated: a second file would be a
      # second source of truth and can drift. (The v2.5.0 manual merge of
      # generated notes + hand-written guide was a one-time migration.)
      - name: Explain where the file went
        run: |
          {
            echo "## Release ${{ steps.version.outputs.tag }} published"
            echo
            echo "Notes generated from merged pull requests and attached to the release."
            echo
            echo "The same file (\`${{ steps.writeup.outputs.file }}\`) is committed to"
            echo "branch \`release-notes/v${{ steps.version.outputs.version }}\` and attached"
            echo "to this workflow run as an artifact."
            if [ "${{ steps.notes_pr.outputs.created }}" = "true" ]; then
              echo "Pull request #${{ steps.notes_pr.outputs.number }} proposes it to \`main\`."
            else
              echo
              echo "GitHub Actions was not allowed to create the pull request. Open it here:"
              echo "${{ steps.notes_pr.outputs.compare_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
